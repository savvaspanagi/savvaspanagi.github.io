bio: |
  I am an enthusiastic electrical engineer researcher based in Cyprus, specializing in Energy Power Systems.
  From an early age, I have been passionate about programming, troubleshooting computer hardware, and experimenting
  with electrical systems. This passion led me to study electrical and computer engineering.

  I am currently an Industrial PhD Student at the Electricity Authority of Cyprus and a Part-time Researcher at the
  Sustainable Power System Lab of the Cyprus University of Technology. On this website I share notes from my learning
  journey across power systems, programming, automations, Arduino, mathematics, and related topics.

