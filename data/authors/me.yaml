  - role: MSCA Ph.D. Student – Doctoral Candidate
    org: Electricity Authority of Cyprus – DENSE Horizon Europe MSCA Doctoral Network
    start: 2024-06-01
    summary: |
      Research focuses on optimizing the operation of electric vehicles and heat pumps within active distribution networks.
      This industrial PhD bridges academic research and practical application in the energy sector through collaboration
      between Cyprus University of Technology and the Electricity Authority of Cyprus (EAC).
      DENSE is a 4-year Marie Skłodowska-Curie Actions Doctoral Network:
      https://www.dense-dn.eu/
  - role: Researcher
    org: Cyprus University of Technology – Sustainable Power Systems Laboratory
    start: 2023-06-01
    end: 2024-05-31
    summary: |
      Project 1: In collaboration with the TSO and DSO of Cyprus, developed technical requirements for integrating Energy
      Storage Systems (ESS) into the power grid and technical standards for grid-forming inverters to support voltage and
      frequency regulation.

      Project 2: Operating marginal policy for frequency reserves in Cyprus's power system — dimensioning inertia, FFR,
      FCR, FRR, and RR for day-ahead scheduling, with verification using DIgSILENT PowerFactory and Python.
